<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Safe Route Admin{% endblock %}</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <!-- ADDED: Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <aside class="sidebar">
        <div>
            <h1>Safe Route Admin</h1>
            <nav class="nav">
                <a href="{{ url_for('admin.dashboard') }}" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">🏠 Dashboard</a>
                <a href="{{ url_for('admin.manage_destination') }}" class="nav-link {% if active_page == 'destinations' %}active{% endif %}">📍 Manage Destination</a>
                <a href="{{ url_for('admin.manage_users') }}" class="nav-link {% if active_page == 'users' %}active{% endif %}">👥 Manage Users</a>
                <a href="{{ url_for('admin.monitor') }}" class="nav-link {% if active_page == 'monitor' %}active{% endif %}">🛡️ Safety Monitor</a>
                <!-- ADDED: New link to the Safety Analysis page -->
                <a href="{{ url_for('admin.safety_analysis') }}" class="nav-link {% if active_page == 'safety_analysis' %}active{% endif %}">📊 Safety Analysis</a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <a href="{{ url_for('auth.logout') }}" class="logout">⬅ Logout</a>
            <span>© 2025 Safe RouteAI. All rights reserved.</span>
        </div>
    </aside>

    <!-- MODIFIED: Wrapped main content in a container to add a header -->
    <div class="main-container">
        <header class="top-header">
            <div class="user-profile">
                <i class="fas fa-user-circle"></i>
                <span>{{ session.username or 'Admin' }}</span>
            </div>
        </header>

        <main class="main" id="content">
            <!-- Content from child templates will be inserted here -->
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- This block allows child templates to add their own scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
